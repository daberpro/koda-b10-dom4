<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0px;
                padding: 0px;
            }
        </style>
    </head>
    <body>
        <div id="container"></div>
        <script>
            const container = document.getElementById("container");
            container.style = "border: 4px solid black;width: fit-content;"

            for (let i = 0; i < 8; i++) {
                if (i % 2 == 0) {
                    const container_row = document.createElement("div");
                    container_row.style = "display: flex;";
                    for (let j = 0; j < 8; j++) {
                        if (j % 2 == 0) {
                            const inside = document.createElement("div");
                            inside.style =
                                "width: 100px; height: 100px; background: black;";
                            container_row.appendChild(inside);
                        }
                        if (j % 2 == 1) {
                            const inside = document.createElement("div");
                            inside.style =
                                "width: 100px; height: 100px; background: white;";
                            container_row.appendChild(inside);
                        }
                    }
                    container.appendChild(container_row);
                }
                if (i % 2 == 1) {
                    const container_row = document.createElement("div");
                    container_row.style = "display: flex;";
                    for (let j = 0; j < 8; j++) {
                        if (j % 2 == 0) {
                            const inside = document.createElement("div");
                            inside.style =
                                "width: 100px; height: 100px; background: white;";
                            container_row.appendChild(inside);
                        }
                        if (j % 2 == 1) {
                            const inside = document.createElement("div");
                            inside.style =
                                "width: 100px; height: 100px; background: black;";
                            container_row.appendChild(inside);
                        }
                    }
                    container.appendChild(container_row);
                }
            }
            document.body.appendChild(container);
        </script>
    </body>
</html>
